[package]
name = "gpui-mullion"
version = "0.1.0"
edition = "2021"
autoexamples = false
rust-version = "1.95"
description = "Native GPUI split panes with activity bars"
license = "MIT"
repository = "https://github.com/ignition-is-go/gpui-mullion"
keywords = ["gpui", "panes", "split-view"]
categories = ["gui"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "08827f9208b4848d62f3faf86ffa15155966d63c" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "08827f9208b4848d62f3faf86ffa15155966d63c" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "demo"
path = "examples/demo.rs"
