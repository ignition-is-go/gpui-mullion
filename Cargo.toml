[package]
name = "gpui-mullion"
publish = false
version = "0.1.0"
edition = "2021"
autoexamples = false
rust-version = "1.95"
description = "Cross-platform GPUI split panes with activity bars"
license = "MIT"
repository = "https://github.com/ignition-is-go/gpui-mullion"
keywords = ["gpui", "panes", "split-view"]
categories = ["gui"]


[features]
default = []
# Deterministic state/input probes for integration tests and the browser demo harness.
test-support = []

[dependencies]
gpui = { package = "gpui-unofficial", version = "=1.16.1" }
gpui-command-palette = { git = "https://github.com/ignition-is-go/gpui-command-palette.git" }
lucide-icons = "1.31"
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.16.1", features = ["wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
scheduler = { package = "scheduler-gpui-unofficial", version = "=1.16.1" }

[dev-dependencies]
gpui = { package = "gpui-unofficial", version = "=1.16.1", features = ["test-support"] }
serde_json = "1"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "detached-window"
path = "examples/detached_window.rs"
