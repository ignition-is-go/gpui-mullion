[workspace]

[package]
name = "mullion-web-demo"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "mullion-web-demo"
path = "main.rs"

[dependencies]
gpui-mullion = { path = "../..", features = ["test-support"] }
gpui = { package = "gpui-unofficial", version = "=1.16.1" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.16.1" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "debuginfo"
