[workspace]

[package]
name = "mullion-web-demo"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "mullion-web-demo"
path = "main.rs"

[dependencies]
gpui-mullion = { path = "../.." }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "08827f9208b4848d62f3faf86ffa15155966d63c" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "08827f9208b4848d62f3faf86ffa15155966d63c" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"
