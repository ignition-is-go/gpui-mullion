name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish-dry-run:
    name: crates.io publish dry run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GPUI libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Verify the crate is publishable
        run: cargo publish --dry-run

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev weston xvfb mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Verify Linux window backends
        if: runner.os == 'Linux'
        run: |
          cargo tree -e features -i gpui_linux | grep -F 'gpui_linux feature "wayland"'
          cargo tree -e features -i gpui_linux | grep -F 'gpui_linux feature "x11"'
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Execute native Mullion demo on Wayland
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --example demo
          .github/scripts/check_wayland_demo.sh
      - name: Check nested browser workspace on native host
        if: runner.os == 'Linux'
        run: |
          cargo fmt --manifest-path examples/web/Cargo.toml -- --check
          cargo check --manifest-path examples/web/Cargo.toml --all-targets
          cargo test --manifest-path examples/web/Cargo.toml --all-targets
          cargo clippy --manifest-path examples/web/Cargo.toml --all-targets -- -D warnings

  web:
    name: wasm32 and browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src, rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format browser workspace
        run: cargo fmt --manifest-path examples/web/Cargo.toml -- --check
      - name: Check shared view and browser host
        run: cargo check --manifest-path examples/web/Cargo.toml --target wasm32-unknown-unknown
      - name: Clippy shared view and browser host
        run: cargo clippy --manifest-path examples/web/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Install Google Chrome stable
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install virtual browser display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build browser demo
        run: cd examples/web && env -u NO_COLOR trunk build --release
      - name: Execute built WASM in Google Chrome under Xvfb
        shell: bash
        run: |
          python3 .github/scripts/serve_dist.py examples/web/dist > /tmp/mullion-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS -D /tmp/headers http://127.0.0.1:8181/ -o /tmp/index.html; then
              break
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/mullion-server.log
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/index.html || { cat /tmp/mullion-server.log; exit 1; }
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/headers
          grep -qi '^cross-origin-embedder-policy: require-corp' /tmp/headers
          setsid xvfb-run -a "${{ steps.setup-chrome.outputs.chrome-path }}" \
            --no-sandbox --no-first-run --no-default-browser-check \
            --disable-dev-shm-usage --enable-unsafe-webgpu \
            --enable-unsafe-swiftshader --use-angle=swiftshader --use-vulkan=swiftshader \
            --enable-features=Vulkan,UseSkiaRenderer --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/mullion-chrome http://127.0.0.1:8181/ \
            > /tmp/mullion-chrome.log 2>&1 &
          chrome=$!
          trap 'kill -TERM -- -"$chrome" 2>/dev/null || true; kill "$server" 2>/dev/null || true' EXIT
          if ! timeout 75 node .github/scripts/check_browser.mjs http://127.0.0.1:8181/ \
            || ! timeout 45 node examples/web/check_demo_bridge.mjs http://127.0.0.1:8181/; then
            cat /tmp/mullion-chrome.log
            test ! -f /tmp/mullion-browser-failure.json || cat /tmp/mullion-browser-failure.json
            exit 1
          fi
      - name: Upload browser interaction diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mullion-browser-interaction-diagnostics
          path: |
            /tmp/mullion-browser-failure.json
            /tmp/mullion-browser-failure.png
            /tmp/mullion-chrome.log
            /tmp/mullion-server.log
          if-no-files-found: ignore
